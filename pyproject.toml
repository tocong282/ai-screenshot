[project]
name = "ai-screenshot"
version = "0.2.0"
description = "Screenshot -> OCR -> LLM answer -> clipboard, on Linux, macOS and Windows"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=9.0",
]

[project.scripts]
ai-screenshot = "ai_screenshot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["ai_screenshot"]
